<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Precision Burn Studio — Admin Login</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 30px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .logo-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-title h1 {
      margin: 0 0 8px;
      color: #d4af37;
      font-size: 26px;
    }

    .logo-title p {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 18px;

      background: #111;
      color: #fff;

      border: 1px solid #555;
      border-radius: 6px;

      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 13px;

      background: #d4af37;
      color: #111;

      border: none;
      border-radius: 6px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      background: #3a1717;
      color: #ff8a8a;
      border: 1px solid #6b2929;
    }

    .success {
      background: #173a20;
      color: #8aff9a;
      border: 1px solid #296b38;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo-title">
      <h1>Precision Burn Studio</h1>
      <p>Admin Login</p>
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Log In
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://novkaqylwqdtwceypyrk.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vdmthcXlsd3FkdHdjZXlweXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDk5NDMsImV4cCI6MjEwNTU4NTk0M30.5byp2I56KsiZ9NceDOBBUgTK_e5oR3P9It8lABbgd8M";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.style.display = "none";
      message.className = "";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent =
          "Login failed. Please check your email and password.";

        message.className = "error";
        message.style.display = "block";

        return;
      }

     message.textContent =
  "Login successful.";

message.className = "success";
message.style.display = "block";

console.log("Authenticated user:", data.user);

window.location.href =
  "https://precisionburnstudio.github.io/Precision-Burn-Studio/admin-dashboard.html";
    });

  </script>

</body>
</html>
