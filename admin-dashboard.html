    .header {

    .header p {

    .logout-button {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;

    .logout-button:hover {

    .dashboard {

      max-width: 1100px;

    .welcome-box {
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 30px;
    }

    .welcome-box h2 {
      margin-top: 0;
      color: #d4af37;
    }

    .welcome-box p {
      color: #ccc;
      line-height: 1.6;
    }

    .status {

      padding: 15px;
      background: #173a20;
      border: 1px solid #296b38;
      border-radius: 6px;
      color: #8aff9a;
    }

     .quotes-section {
      margin-top: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h2 {
      margin: 0;
    }

    #refreshQuotesButton {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #refreshQuotesButton:hover {
      opacity: 0.85;
    }

    .quote-message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
    }

    #quotesTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    #quotesTable th,
    #quotesTable td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #ccc;
      vertical-align: top;
    }

    #quotesTable th {
      font-weight: bold;
      white-space: nowrap;
    }

    #quotesTable td {
      line-height: 1.4;
    }

    #quotesTable td:nth-child(4) {
      min-width: 220px;
    }

    #quotesTable td:nth-child(6) {
      white-space: nowrap;
    }
 .quote-details-section {
      margin-top: 30px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 25px;
    }

    .quote-details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 25px;
    }

    .quote-detail-item {
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
    }

    .quote-detail-label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .quote-detail-value {
      color: #fff;
      line-height: 1.5;
      word-break: break-word;
    }

    .quote-detail-full {
      grid-column: 1 / -1;
    }

    .quote-number-button {
      background: none;
      border: none;
      padding: 0;
      color: #d4af37;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      font-size: inherit;
    }

    .quote-number-button:hover {
      opacity: 0.8;
    }

    #closeQuoteDetailsButton {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
#editQuoteButton,
#saveQuoteButton,
#cancelEditButton {

  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

#editQuoteButton {

  color: #111;

#saveQuoteButton {
  background: #2f7d32;
  color: #fff;
}

#cancelEditButton {
  background: #555;
  color: #fff;

#editQuoteButton:hover,
#saveQuoteButton:hover,
#cancelEditButton:hover {
  opacity: 0.85;
}

.edit-field {
  width: 100%;
  box-sizing: border-box;
  padding: 9px;
  margin-top: 5px;
  background: #1c1c1c;
  color: #fff;
  border: 1px solid #555;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.edit-field:focus {
  outline: none;
  border-color: #d4af37;
}

textarea.edit-field {
  min-height: 100px;
  resize: vertical;
}

.edit-mode-notice {
  margin-bottom: 20px;
  padding: 12px;
  background: #332d13;
  border: 1px solid #d4af37;
  border-radius: 6px;
  color: #f1d76a;
}

.locked-notice {

  padding: 12px;
  background: #3a1717;
  border: 1px solid #8b3a3a;
  border-radius: 6px;
  color: #ff9b9b;

    @media (max-width: 700px) {
      .quote-details-grid {
        grid-template-columns: 1fr;
      }

      .quote-detail-full {
        grid-column: auto;
      }
    }
  </style>
</head>

async function loadQuotes() {
  const quoteMessage = document.getElementById("quoteMessage");
  const quotesTableBody = document.getElementById("quotesTableBody");

  quoteMessage.textContent = "Loading quotes...";
  quoteMessage.style.display = "block";
  quotesTableBody.innerHTML = "";

  const { data, error } = await supabaseClient
    .from("Quotes")
    .select(`
      Quote_number,
      Customer_name,
      Project_type,
      Project_description,
      Quantity,
      Total,
      Status,
      Payment_status,
      Production_status,
      Expires_at
    `)
    .order("Quote_number", { ascending: false });

  if (error) {
    console.error("Error loading quotes:", error);

    quoteMessage.textContent =
      "Unable to load quotes. Please try again.";

    return;
  }

  if (!data || data.length === 0) {
    quoteMessage.textContent = "No quotes found.";
    return;
  }

  quoteMessage.style.display = "none";

  data.forEach(function(quote) {
    const row = document.createElement("tr");

    const expires = quote.Expires_at
      ? new Date(quote.Expires_at).toLocaleDateString()
      : "—";

    const total = quote.Total !== null && quote.Total !== undefined
      ? "$" + Number(quote.Total).toFixed(2)
      : "—";

   row.innerHTML = `
  <td>
    <button
      class="quote-number-button"
      type="button"
      data-quote-number="${escapeHtml(quote.Quote_number)}"
    >
      ${escapeHtml(quote.Quote_number)}
    </button>
  </td>
  <td>${escapeHtml(quote.Customer_name)}</td>
  <td>${escapeHtml(quote.Project_type)}</td>
  <td>${escapeHtml(quote.Project_description)}</td>
  <td>${escapeHtml(quote.Quantity)}</td>
  <td>${escapeHtml(total)}</td>
  <td>${escapeHtml(quote.Status)}</td>
  <td>${escapeHtml(quote.Payment_status)}</td>
  <td>${escapeHtml(quote.Production_status)}</td>
  <td>${escapeHtml(expires)}</td>
`;

    quotesTableBody.appendChild(row);
  });

  quoteMessage.textContent =
    `${data.length} quote${data.length === 1 ? "" : "s"} loaded.`;
  quoteMessage.style.display = "block";
}

document
  .getElementById("refreshQuotesButton")
  .addEventListener("click", loadQuotes);

loadQuotes();
   function escapeHtml(value) {
  return String(value ?? "—")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

  setDateTimeInput(
    "editCompletion",
    currentQuoteData.Preferred_completion_date
  );

  setDateTimeInput(
    "editExpiration",
    currentQuoteData.Expires_at
  );
}
    function setDateTimeInput(elementId, value) {

  const input = document.getElementById(elementId);

  if (!input || !value) {
    return;
  }

  const date = new Date(value);

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  const hours = String(date.getHours()).padStart(2, "0");
  const minutes = String(date.getMinutes()).padStart(2, "0");

  input.value =
    `${year}-${month}-${day}T${hours}:${minutes}`;
}
    document.addEventListener("click", function(event) {
  const button =
    event.target.closest(".quote-number-button");

  if (!button) {
    return;
  }

  const quoteNumber =
    button.getAttribute("data-quote-number");

  if (quoteNumber) {
    showQuoteDetails(quoteNumber);
  }
});

document
  .getElementById("closeQuoteDetailsButton")
  .addEventListener("click", function() {

    document.getElementById(
      "quoteDetailsSection"
    ).style.display = "none";

  });
    document
  .getElementById("editQuoteButton")
  .addEventListener("click", function() {

    enterEditMode();

  });

document.addEventListener("click", function(event) {

  if (event.target.id === "cancelEditButton") {

    if (currentQuoteData) {
      showQuoteDetails(currentQuoteData.Quote_number);
    }

    return;
  }

 if (event.target.id === "saveQuoteButton") {

  const quoteNumber = currentQuoteData?.Quote_number;

  if (!quoteNumber) {
    alert("Unable to save: quote number is missing.");
    return;
  }

  const quantity = Number(
    document.getElementById("editQuantity").value
  );

  const subtotal = Number(
    document.getElementById("editSubtotal").value
  );

  const deliveryFee = Number(
    document.getElementById("editDelivery").value
  );

  const shippingCost = Number(
    document.getElementById("editShipping").value
  );

  const total = Number(
    document.getElementById("editTotal").value
  );

  if (!Number.isInteger(quantity) || quantity < 1) {
    alert("Quantity must be a whole number greater than 0.");
    return;
  }

  if (
    !Number.isFinite(subtotal) ||
    subtotal < 0 ||
    !Number.isFinite(deliveryFee) ||
    deliveryFee < 0 ||
    !Number.isFinite(shippingCost) ||
    shippingCost < 0 ||
    !Number.isFinite(total) ||
    total < 0
  ) {
    alert("Please enter valid pricing values.");
    return;
  }

  const completionValue =
    document.getElementById("editCompletion").value;

  const expirationValue =
    document.getElementById("editExpiration").value;

  const preferredCompletionDate =
    completionValue
      ? new Date(completionValue).toISOString()
      : null;

  const expiresAt =
    expirationValue
      ? new Date(expirationValue).toISOString()
      : null;

  const { data, error } = await supabaseClient.rpc(
    "admin_update_unpaid_quote",
    {
      p_quote_number: quoteNumber,
      p_description:
        document.getElementById("editDescription").value,
      p_quantity: quantity,
      p_size:
        document.getElementById("editSize").value,
      p_subtotal: subtotal,
      p_delivery_fee: deliveryFee,
      p_shipping_cost: shippingCost,
      p_total: total,
      p_status:
        document.getElementById("editStatus").value,
      p_production_status:
        document.getElementById("editProductionStatus").value,
      p_preferred_completion_date:
        preferredCompletionDate,
      p_expires_at:
        expiresAt,
      p_customer_notes:
        document.getElementById("editCustomerNotes").value,
      p_internal_notes:
        document.getElementById("editInternalNotes").value
    }
  );

  if (error) {
    console.error("Save Quote RPC error:", error);

    alert(
      "Save failed. The quote was not changed.\n\n" +
      error.message
    );

    return;
  }

  if (!data || data.success !== true) {

    alert(
      data?.error ||
      "Save failed. The quote was not changed."
    );

    return;
  }

  alert(
    data.message ||
    "Quote updated successfully."
  );

  showQuoteDetails(quoteNumber);

  return;
}

});
