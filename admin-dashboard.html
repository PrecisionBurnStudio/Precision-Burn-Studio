<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Precision Burn Studio — Admin Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #1c1c1c;
      border-bottom: 1px solid #444;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header h1 {
      margin: 0;
      color: #d4af37;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    .logout-button {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-button:hover {
      opacity: 0.9;
    }

    .dashboard {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .welcome-box {
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 30px;
    }

    .welcome-box h2 {
      margin-top: 0;
      color: #d4af37;
    }

    .welcome-box p {
      color: #ccc;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      background: #173a20;
      border: 1px solid #296b38;
      border-radius: 6px;
      color: #8aff9a;
    }

     .quotes-section {
      margin-top: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h2 {
      margin: 0;
    }

    #refreshQuotesButton {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #refreshQuotesButton:hover {
      opacity: 0.85;
    }

    .quote-message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
    }

    #quotesTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    #quotesTable th,
    #quotesTable td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #ccc;
      vertical-align: top;
    }

    #quotesTable th {
      font-weight: bold;
      white-space: nowrap;
    }

    #quotesTable td {
      line-height: 1.4;
    }

    #quotesTable td:nth-child(4) {
      min-width: 220px;
    }

    #quotesTable td:nth-child(6) {
      white-space: nowrap;
    }
 .quote-details-section {
      margin-top: 30px;
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 25px;
    }

    .quote-details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 25px;
    }

    .quote-detail-item {
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
    }

    .quote-detail-label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .quote-detail-value {
      color: #fff;
      line-height: 1.5;
      word-break: break-word;
    }

    .quote-detail-full {
      grid-column: 1 / -1;
    }

    .quote-number-button {
      background: none;
      border: none;
      padding: 0;
      color: #d4af37;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
      font-size: inherit;
    }

    .quote-number-button:hover {
      opacity: 0.8;
    }

    #closeQuoteDetailsButton {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .quote-details-grid {
        grid-template-columns: 1fr;
      }

      .quote-detail-full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div>
      <h1>Precision Burn Studio</h1>
      <p>Admin Dashboard</p>
    </div>

    <button
      id="logoutButton"
      class="logout-button"
      type="button"
    >
      Log Out
    </button>

  </header>

  <main class="dashboard">

    <div class="welcome-box">

      <h2>Welcome, Gregory</h2>

      <p>
        You are successfully logged into the
        Precision Burn Studio admin area.
      </p>

      <div class="status">
        Admin authentication verified.
      </div>

    </div>

    <section class="quotes-section">

      <div class="section-header">
        <h2>Quotes</h2>

        <button id="refreshQuotesButton" type="button">
          Refresh Quotes
        </button>
      </div>

      <div id="quoteMessage" class="quote-message">
        Loading quotes...
      </div>

      <div class="table-wrapper">

        <table id="quotesTable">

          <thead>
            <tr>
              <th>Quote #</th>
              <th>Customer</th>
              <th>Project</th>
              <th>Description</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Status</th>
              <th>Payment</th>
              <th>Production</th>
              <th>Expires</th>
            </tr>
          </thead>

          <tbody id="quotesTableBody">
          </tbody>

        </table>

      </div>

    </section>
<section
      id="quoteDetailsSection"
      class="quote-details-section"
      style="display: none;"
    >

      <div class="section-header">
        <h2>Quote Details</h2>

        <button
          id="closeQuoteDetailsButton"
          type="button"
        >
          Close
        </button>
      </div>

      <div id="quoteDetailsContent">
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://novkaqylwqdtwceypyrk.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vdmthcXlsd3FkdHdjZXlweXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDk5NDMsImV4cCI6MjEwNTU4NTk0M30.5byp2I56KsiZ9NceDOBBUgTK_e5oR3P9It8lABbgd8M";

    const sessionStorageAdapter = {
  getItem: (key) => sessionStorage.getItem(key),
  setItem: (key, value) => sessionStorage.setItem(key, value),
  removeItem: (key) => sessionStorage.removeItem(key)
};

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storage: sessionStorageAdapter,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

    async function checkAuthentication() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (!session) {

        window.location.href =
          "admin.html";

        return;
      }

    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "admin.html";

      });

    checkAuthentication();
async function loadQuotes() {
  const quoteMessage = document.getElementById("quoteMessage");
  const quotesTableBody = document.getElementById("quotesTableBody");

  quoteMessage.textContent = "Loading quotes...";
  quoteMessage.style.display = "block";
  quotesTableBody.innerHTML = "";

  const { data, error } = await supabaseClient
    .from("Quotes")
    .select(`
      Quote_number,
      Customer_name,
      Project_type,
      Project_description,
      Quantity,
      Total,
      Status,
      Payment_status,
      Production_status,
      Expires_at
    `)
    .order("Quote_number", { ascending: false });

  if (error) {
    console.error("Error loading quotes:", error);

    quoteMessage.textContent =
      "Unable to load quotes. Please try again.";

    return;
  }

  if (!data || data.length === 0) {
    quoteMessage.textContent = "No quotes found.";
    return;
  }

  quoteMessage.style.display = "none";

  data.forEach(function(quote) {
    const row = document.createElement("tr");

    const expires = quote.Expires_at
      ? new Date(quote.Expires_at).toLocaleDateString()
      : "—";

    const total = quote.Total !== null && quote.Total !== undefined
      ? "$" + Number(quote.Total).toFixed(2)
      : "—";

   row.innerHTML = `
  <td>
    <button
      class="quote-number-button"
      type="button"
      data-quote-number="${escapeHtml(quote.Quote_number)}"
    >
      ${escapeHtml(quote.Quote_number)}
    </button>
  </td>
  <td>${escapeHtml(quote.Customer_name)}</td>
  <td>${escapeHtml(quote.Project_type)}</td>
  <td>${escapeHtml(quote.Project_description)}</td>
  <td>${escapeHtml(quote.Quantity)}</td>
  <td>${escapeHtml(total)}</td>
  <td>${escapeHtml(quote.Status)}</td>
  <td>${escapeHtml(quote.Payment_status)}</td>
  <td>${escapeHtml(quote.Production_status)}</td>
  <td>${escapeHtml(expires)}</td>
`;

    quotesTableBody.appendChild(row);
  });

  quoteMessage.textContent =
    `${data.length} quote${data.length === 1 ? "" : "s"} loaded.`;
  quoteMessage.style.display = "block";
}

document
  .getElementById("refreshQuotesButton")
  .addEventListener("click", loadQuotes);

loadQuotes();
   function escapeHtml(value) {
  return String(value ?? "—")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function showQuoteDetails(quoteNumber) {
  const detailsSection =
    document.getElementById("quoteDetailsSection");

  const detailsContent =
    document.getElementById("quoteDetailsContent");

  detailsContent.innerHTML =
    "<p>Loading quote details...</p>";

  detailsSection.style.display = "block";

  const { data, error } = await supabaseClient
    .from("Quotes")
    .select(`
      Quote_number,
      Customer_name,
      Customer_email,
      Customer_phone,
      Project_type,
      Project_description,
      Personalization,
      Quantity,
      Size,
      Material,
      Design_reference,
      Subtotal,
      Delivery_fee,
      Shipping_cost,
      Total,
      Status,
      Issued_at,
      Expires_at,
      Payment_status,
      Preferred_completion_date,
      Production_status,
      Customer_notes,
      Internal_notes
    `)
    .eq("Quote_number", quoteNumber)
    .single();

  if (error) {
    console.error("Error loading quote details:", error);

    detailsContent.innerHTML =
      "<p>Unable to load quote details. Please try again.</p>";

    return;
  }

  function formatDate(value) {
    if (!value) {
      return "—";
    }

    return escapeHtml(new Date(value).toLocaleString());
  }

  function formatMoney(value) {
    if (value === null || value === undefined) {
      return "—";
    }

    return escapeHtml("$" + Number(value).toFixed(2));
  }

  detailsContent.innerHTML = `
    <div class="quote-details-grid">

      <div class="quote-detail-item">
        <span class="quote-detail-label">Quote Number</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Quote_number)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Customer</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Customer_name)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Email</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Customer_email)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Phone</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Customer_phone)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Project Type</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Project_type)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Quantity</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Quantity)}
        </div>
      </div>

      <div class="quote-detail-item quote-detail-full">
        <span class="quote-detail-label">Project Description</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Project_description)}
        </div>
      </div>

      <div class="quote-detail-item quote-detail-full">
        <span class="quote-detail-label">Personalization</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Personalization)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Size</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Size)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Material</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Material)}
        </div>
      </div>

      <div class="quote-detail-item quote-detail-full">
        <span class="quote-detail-label">Design Reference</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Design_reference)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Subtotal</span>
        <div class="quote-detail-value">
          ${formatMoney(data.Subtotal)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Delivery Fee</span>
        <div class="quote-detail-value">
          ${formatMoney(data.Delivery_fee)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Shipping Cost</span>
        <div class="quote-detail-value">
          ${formatMoney(data.Shipping_cost)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Total</span>
        <div class="quote-detail-value">
          ${formatMoney(data.Total)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Quote Status</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Status)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Payment Status</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Payment_status)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Preferred Completion</span>
        <div class="quote-detail-value">
          ${formatDate(data.Preferred_completion_date)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Production Status</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Production_status)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Issued</span>
        <div class="quote-detail-value">
          ${formatDate(data.Issued_at)}
        </div>
      </div>

      <div class="quote-detail-item">
        <span class="quote-detail-label">Expires</span>
        <div class="quote-detail-value">
          ${formatDate(data.Expires_at)}
        </div>
      </div>

      <div class="quote-detail-item quote-detail-full">
        <span class="quote-detail-label">Customer Notes</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Customer_notes)}
        </div>
      </div>

      <div class="quote-detail-item quote-detail-full">
        <span class="quote-detail-label">Internal Notes</span>
        <div class="quote-detail-value">
          ${escapeHtml(data.Internal_notes)}
        </div>
      </div>

    </div>
  `;
}
    document.addEventListener("click", function(event) {
  const button =
    event.target.closest(".quote-number-button");

  if (!button) {
    return;
  }

  const quoteNumber =
    button.getAttribute("data-quote-number");

  if (quoteNumber) {
    showQuoteDetails(quoteNumber);
  }
});

document
  .getElementById("closeQuoteDetailsButton")
  .addEventListener("click", function() {

    document.getElementById(
      "quoteDetailsSection"
    ).style.display = "none";

  });

  </script>

</body>
</html>
