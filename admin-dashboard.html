<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Precision Burn Studio — Admin Dashboard</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      background: #1c1c1c;
      border-bottom: 1px solid #444;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header h1 {
      margin: 0;
      color: #d4af37;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    .logout-button {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-button:hover {
      opacity: 0.9;
    }

    .dashboard {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .welcome-box {
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 30px;
    }

    .welcome-box h2 {
      margin-top: 0;
      color: #d4af37;
    }

    .welcome-box p {
      color: #ccc;
      line-height: 1.6;
    }

    .status {
      margin-top: 25px;
      padding: 15px;
      background: #173a20;
      border: 1px solid #296b38;
      border-radius: 6px;
      color: #8aff9a;
    }

     .quotes-section {
      margin-top: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h2 {
      margin: 0;
    }

    #refreshQuotesButton {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #refreshQuotesButton:hover {
      opacity: 0.85;
    }

    .quote-message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
    }

    #quotesTable {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    #quotesTable th,
    #quotesTable td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #ccc;
      vertical-align: top;
    }

    #quotesTable th {
      font-weight: bold;
      white-space: nowrap;
    }

    #quotesTable td {
      line-height: 1.4;
    }

    #quotesTable td:nth-child(4) {
      min-width: 220px;
    }

    #quotesTable td:nth-child(6) {
      white-space: nowrap;
    }

  </style>
</head>

<body>

  <header class="header">

    <div>
      <h1>Precision Burn Studio</h1>
      <p>Admin Dashboard</p>
    </div>

    <button
      id="logoutButton"
      class="logout-button"
      type="button"
    >
      Log Out
    </button>

  </header>

  <main class="dashboard">

    <div class="welcome-box">

      <h2>Welcome, Gregory</h2>

      <p>
        You are successfully logged into the
        Precision Burn Studio admin area.
      </p>

      <div class="status">
        Admin authentication verified.
      </div>

    </div>

    <section class="quotes-section">

      <div class="section-header">
        <h2>Quotes</h2>

        <button id="refreshQuotesButton" type="button">
          Refresh Quotes
        </button>
      </div>

      <div id="quoteMessage" class="quote-message">
        Loading quotes...
      </div>

      <div class="table-wrapper">

        <table id="quotesTable">

          <thead>
            <tr>
              <th>Quote #</th>
              <th>Customer</th>
              <th>Project</th>
              <th>Description</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Status</th>
              <th>Payment</th>
              <th>Production</th>
              <th>Expires</th>
            </tr>
          </thead>

          <tbody id="quotesTableBody">
          </tbody>

        </table>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://novkaqylwqdtwceypyrk.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vdmthcXlsd3FkdHdjZXlweXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDk5NDMsImV4cCI6MjEwNTU4NTk0M30.5byp2I56KsiZ9NceDOBBUgTK_e5oR3P9It8lABbgd8M";

    const sessionStorageAdapter = {
  getItem: (key) => sessionStorage.getItem(key),
  setItem: (key, value) => sessionStorage.setItem(key, value),
  removeItem: (key) => sessionStorage.removeItem(key)
};

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      storage: sessionStorageAdapter,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

    async function checkAuthentication() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (!session) {

        window.location.href =
          "admin.html";

        return;
      }

    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "admin.html";

      });

    checkAuthentication();
async function loadQuotes() {
  const quoteMessage = document.getElementById("quoteMessage");
  const quotesTableBody = document.getElementById("quotesTableBody");

  quoteMessage.textContent = "Loading quotes...";
  quoteMessage.style.display = "block";
  quotesTableBody.innerHTML = "";

  const { data, error } = await supabaseClient
    .from("Quotes")
    .select(`
      Quote_number,
      Customer_name,
      Project_type,
      Project_description,
      Quantity,
      Total,
      Status,
      Payment_status,
      Production_status,
      Expires_at
    `)
    .order("Issued_at", { ascending: false });

  if (error) {
    console.error("Error loading quotes:", error);

    quoteMessage.textContent =
      "Unable to load quotes. Please try again.";

    return;
  }

  if (!data || data.length === 0) {
    quoteMessage.textContent = "No quotes found.";
    return;
  }

  quoteMessage.style.display = "none";

  data.forEach(function(quote) {
    const row = document.createElement("tr");

    const expires = quote.Expires_at
      ? new Date(quote.Expires_at).toLocaleDateString()
      : "—";

    const total = quote.Total !== null && quote.Total !== undefined
      ? "$" + Number(quote.Total).toFixed(2)
      : "—";

    row.innerHTML = `
      <td>${quote.Quote_number ?? "—"}</td>
      <td>${quote.Customer_name ?? "—"}</td>
      <td>${quote.Project_type ?? "—"}</td>
      <td>${quote.Project_description ?? "—"}</td>
      <td>${quote.Quantity ?? "—"}</td>
      <td>${total}</td>
      <td>${quote.Status ?? "—"}</td>
      <td>${quote.Payment_status ?? "—"}</td>
      <td>${quote.Production_status ?? "—"}</td>
      <td>${expires}</td>
    `;

    quotesTableBody.appendChild(row);
  });

  quoteMessage.textContent =
    `${data.length} quote${data.length === 1 ? "" : "s"} loaded.`;
  quoteMessage.style.display = "block";
}

document
  .getElementById("refreshQuotesButton")
  .addEventListener("click", loadQuotes);

loadQuotes();
  </script>

</body>
</html>
